<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About:Blank Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tiny5&display=swap');

    :root {
        --background: #06384b;
        --orange: #ff8c00;
        --yellow: #ffb000;
        --dim-orange: rgba(255, 140, 0, 0.35);
        --red: #ff5555;
    }

    * {
        box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: var(--background);
      color: var(--orange);
      font-family: "Tiny5", monospace;
    }

    .launcher-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 32px;
      border: 4px solid var(--orange);
      border-radius: 14px;
      background: var(--background);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--orange);
    }

    .channel-picker {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
    }

    .channel-picker label {
      font-size: 1.1rem;
      color: var(--yellow);
    }

    select {
      width: 100%;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 1.15rem;
      color: var(--orange);
      background-color: var(--background);
      border: 3px solid var(--orange);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    button {
      padding: 14px 28px;
      font-size: 1.8rem;
      color: var(--orange);
      background-color: var(--background);
      border: 4px solid var(--orange);
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      color: var(--yellow);
      border-color: var(--yellow);
    }

    button:disabled {
      border-color: var(--dim-orange);
      color: var(--dim-orange);
      cursor: not-allowed;
    }

    .reload-versions-button {
      padding: 8px 12px;
      font-size: 1.1rem;
    }

    .sync-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.25rem;
      color: var(--yellow);
      min-height: 24px;
    }

    .sync-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--yellow);
      display: inline-block;
    }

    .syncing .sync-dot {
      animation: pulse 1.2s infinite ease-in-out;
    }

    .ready .sync-dot {
      background-color: #55ff55;
    }

    .error .sync-dot {
      background-color: var(--red);
    }

    .error {
      color: var(--red);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="launcher-card">
    <h1>Chillest Website</h1>
    
    <div class="channel-picker">
      <label for="channelSelect">Version Source:</label>
      <select id="channelSelect" disabled>
        <option value="">Loading versions...</option>
      </select>
      <button id="reloadVersionsBtn" class="reload-versions-button" type="button" aria-label="Reload available versions">Reload versions</button>
    </div>

    <button id="launchBtn" disabled>Unavailable</button>

    <div id="syncStatus" class="sync-status syncing">
      <span class="sync-dot"></span>
      <span id="syncText">Syncing target...</span>
    </div>
  </div>

  <script>
    const REPO = 'CalebEGUDUDE/Chillest-Website';
    const launchBtn = document.getElementById('launchBtn');
    const syncStatus = document.getElementById('syncStatus');
    const syncText = document.getElementById('syncText');
    const channelSelect = document.getElementById('channelSelect');
    const reloadVersionsBtn = document.getElementById('reloadVersionsBtn');

    let resolvedTag = null;
    let cdnRef = null;
    let cdnBaseUrl = '';
    let syncRequestId = 0;

    function updateSyncState(state, message, canLaunch = false, btnText = 'Unavailable') {
      syncStatus.className = `sync-status ${state}`;
      syncText.textContent = message;
      launchBtn.disabled = !canLaunch;
      launchBtn.textContent = btnText;
    }

    async function syncTarget() {
      const selectedVersion = channelSelect.value;
      const requestId = ++syncRequestId;
      resolvedTag = null;
      cdnRef = null;
      cdnBaseUrl = '';

      updateSyncState('syncing', 'Syncing version...', false, 'Syncing...');

      if (!selectedVersion) {
        updateSyncState('error', 'No version selected', false, 'Unavailable');
        return;
      }

      try {
        const commitRes = await fetch(`https://api.github.com/repos/${REPO}/commits/${encodeURIComponent(selectedVersion)}?t=${Date.now()}`, { cache: 'no-store' });
        if (requestId !== syncRequestId) return;
        if (!commitRes.ok) throw new Error('Could not resolve the selected version');
        const commit = await commitRes.json();
        if (requestId !== syncRequestId) return;
        if (!commit || typeof commit.sha !== 'string') throw new Error('Selected version has no commit');

        cdnRef = commit.sha;
        resolvedTag = selectedVersion === 'main' ? 'main branch' : selectedVersion;
      } catch (err) {
        if (requestId !== syncRequestId) return;
        updateSyncState('error', 'Version unavailable', false, 'Unavailable');
        return;
      }

      if (requestId !== syncRequestId) return;
      if (!resolvedTag || !cdnRef) {
        updateSyncState('error', 'Version unavailable', false, 'Unavailable');
        return;
      }

      cdnBaseUrl = `https://cdn.jsdelivr.net/gh/${REPO}@${cdnRef}/`;

      try {
        updateSyncState('syncing', 'Verifying files...', false, 'Syncing...');
        const testRes = await fetch(`${cdnBaseUrl}index.html?t=${Date.now()}`, { cache: 'no-store' });
        if (requestId !== syncRequestId) return;
        
        if (testRes.ok) {
          updateSyncState('ready', `Synced (${resolvedTag})`, true, 'Launch Site');
        } else {
          updateSyncState('error', 'Files unavailable for this version', false, 'Unavailable');
        }
      } catch (err) {
        if (requestId !== syncRequestId) return;
        updateSyncState('error', 'Sync failed', false, 'Unavailable');
      }
    }

    async function loadVersions(preserveSelection = false) {
      const previousSelection = preserveSelection ? channelSelect.value : '';
      reloadVersionsBtn.disabled = true;

      try {
        const releases = await loadAllReleases();
        if (releases.length === 0) throw new Error('No releases found');

        const latestRelease = releases.find(release => !release.prerelease) || releases[0];
        const orderedReleases = [
          latestRelease,
          ...releases.filter(release => release.tag_name !== latestRelease.tag_name)
        ];

        channelSelect.replaceChildren();
        const versionGroup = document.createElement('optgroup');
        versionGroup.label = 'Releases';
        for (const release of orderedReleases) {
          const option = document.createElement('option');
          option.value = release.tag_name;
          const releaseName = release.name?.trim() || release.tag_name;
          option.textContent = release.tag_name === latestRelease.tag_name
            ? `${releaseName} (Latest Release)`
            : releaseName;
          versionGroup.append(option);
        }
        channelSelect.append(versionGroup);

        const mainOption = document.createElement('option');
        mainOption.value = 'main';
        mainOption.textContent = 'main branch (latest changes)';
        channelSelect.append(mainOption);

        channelSelect.value = orderedReleases.some(release => release.tag_name === previousSelection)
          || previousSelection === 'main'
          ? previousSelection
          : latestRelease.tag_name;
        channelSelect.disabled = false;
        await syncTarget();
      } catch (err) {
        channelSelect.replaceChildren();
        const versionGroup = document.createElement('optgroup');
        versionGroup.label = 'Releases unavailable';
        const unavailableOption = document.createElement('option');
        unavailableOption.value = '';
        unavailableOption.textContent = 'Could not load releases';
        versionGroup.append(unavailableOption);
        channelSelect.append(versionGroup);

        const mainOption = document.createElement('option');
        mainOption.value = 'main';
        mainOption.textContent = 'main branch (latest changes)';
        channelSelect.append(mainOption);

        channelSelect.value = '';
        channelSelect.disabled = false;
        updateSyncState('error', 'Could not load releases', false, 'Unavailable');
      } finally {
        reloadVersionsBtn.disabled = false;
      }
    }

    async function loadAllReleases() {
      const releases = [];
      let page = 1;
      let pageReleases;

      do {
        const response = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100&page=${page}&t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load releases');
        pageReleases = await response.json();
        releases.push(...pageReleases);
        page += 1;
      } while (pageReleases.length === 100);

      return releases
        .filter(release => typeof release.tag_name === 'string' && release.tag_name.trim())
        .sort((first, second) => Date.parse(second.published_at || second.created_at) - Date.parse(first.published_at || first.created_at));
    }

    channelSelect.addEventListener('change', syncTarget);
    reloadVersionsBtn.addEventListener('click', () => loadVersions(true));
    loadVersions();

    launchBtn.addEventListener('click', async () => {
      if (!resolvedTag || launchBtn.disabled) return;
      const launchVersion = resolvedTag;
      const launchBaseUrl = cdnBaseUrl;

      const win = window.open('about:blank', '_blank');

      if (!win) {
        updateSyncState('error', 'Popup blocked', false, 'Blocked');
        alert('Please allow popups to open the site.');
        return;
      }

      try {
        const response = await fetch(`${launchBaseUrl}index.html?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('File download failed');

        let htmlContent = await response.text();

        const baseTag = `<base href="${launchBaseUrl}">`;
        if (htmlContent.includes('<head>')) {
          htmlContent = htmlContent.replace('<head>', `<head>${baseTag}`);
        } else {
          htmlContent = baseTag + htmlContent;
        }

        win.document.open();
        win.document.write(htmlContent);
        win.document.close();
        
        if (launchVersion === resolvedTag) {
          updateSyncState('ready', `Synced (${launchVersion})`, true, 'Launch Site');
        }
      } catch (err) {
        if (launchVersion === resolvedTag) {
          updateSyncState('error', 'Launch failed', false, 'Unavailable');
        }
      }
    });

  </script>

</body>
</html>
