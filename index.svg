<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <head>
        <script>
          (function() {
            const XHTML_NS = "http://www.w3.org/1999/xhtml";
            const root = document.querySelector("foreignObject").firstElementChild;
            const originalCreateElement = document.createElement.bind(document);
            const originalCreateElementNS = document.createElementNS.bind(document);

            Object.defineProperty(document, "head", { get() { return root.querySelector("head"); }, configurable: true });
            Object.defineProperty(document, "body", { get() { return root.querySelector("body"); }, configurable: true });
            Object.defineProperty(document, "documentElement", { get() { return root; }, configurable: true });

            document.createElement = function(tagName, options) {
              if (typeof tagName === "string") {
                return originalCreateElementNS(XHTML_NS, tagName, options);
              }
              return originalCreateElement(tagName, options);
            };

            document.createElementNS = function(namespaceURI, qualifiedName, options) {
              if (namespaceURI == null || namespaceURI === XHTML_NS) {
                return originalCreateElementNS(XHTML_NS, qualifiedName, options);
              }
              return originalCreateElementNS(namespaceURI, qualifiedName, options);
            };
          })();
        </script>

        <style><![CDATA[
          html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06384b;
            font-family: Arial, sans-serif;
          }

          foreignObject { overflow: visible; }

          .site {
            width: 100%;
            height: 100%;
            background: #06384b;
            color: #ff8c00;
          }

          .site-header {
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 4px solid #ff8c00;
            background: #06384b;
          }

          h1 {
            margin: 0;
            color: #ff8c00;
            font-size: 28px;
            line-height: 1.1;
            letter-spacing: 0.05em;
            font-weight: 400;
          }

          #splash {
            margin: 0;
            color: #ffb000;
            font-size: 18px;
            line-height: 1.2;
          }

          .site-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            min-height: calc(100% - 100px);
            height: calc(100% - 100px);
          }

          .sidebar {
            padding: 9px 20px;
            border-right: 4px solid #ff8c00;
            background: #06384b;
          }

          .input-wrapper {
            position: relative;
            height: 55px;
            border: 4px solid #ff8c00;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
          }

          .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translateY(-50%);
            border-radius: 9px;
            background: linear-gradient(135deg, #ffb000, #ff8c00);
          }

          .search-input {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 0 10px 0 72px;
            border: 0;
            outline: none;
            background: transparent;
            color: #ff8c00;
            font-size: 28px;
            font-family: Arial, sans-serif;
          }

          .search-input::placeholder {
            color: #ff8c00;
            opacity: 1;
          }

          .catagories {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 9px;
            margin-top: 35px;
          }

          .bar {
            padding: 0;
            border: 0;
            background: transparent;
            color: #ff8c00;
            font-size: 26px;
            line-height: 1.4;
            cursor: default;
            font-family: Arial, sans-serif;
          }

          .bar.active {
            color: #ffb000;
          }

          .games-area {
            min-width: 0;
            background: #06384b;
          }

          .container {
            display: grid;
            grid-template-columns: repeat(4, 165px);
            justify-content: center;
            gap: 80px 47px;
            max-width: 760px;
            margin: 40px auto 0;
            padding: 0 32px 48px;
          }

          .game-card {
            position: relative;
            width: 165px;
            height: 165px;
          }

          .game-name {
            position: absolute;
            right: 0;
            bottom: calc(100% + 8px);
            left: 0;
            color: #ff8c00;
            font-size: 18px;
            text-align: center;
          }

          .thumb {
            display: block;
            width: 165px;
            height: 165px;
            border: 4px solid #ff8c00;
            border-radius: 14px;
            background: linear-gradient(135deg, #0d4465, #1d7fa2);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
          }

          .game-card:nth-child(2) .thumb { background: linear-gradient(135deg, #7c3aed, #312e81); }
          .game-card:nth-child(3) .thumb { background: linear-gradient(135deg, #d946ef, #7c2d12); }
          .game-card:nth-child(4) .thumb { background: linear-gradient(135deg, #16a34a, #14532d); }
          .game-card:nth-child(5) .thumb { background: linear-gradient(135deg, #f59e0b, #7c2d12); }
          .game-card:nth-child(6) .thumb { background: linear-gradient(135deg, #2563eb, #1e3a8a); }
          .game-card:nth-child(7) .thumb { background: linear-gradient(135deg, #6d28d9, #312e81); }
          .game-card:nth-child(8) .thumb { background: linear-gradient(135deg, #0891b2, #155e75); }

          .game-buttons {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 5px 3px;
            background: rgba(6, 56, 75, 0.9);
          }

          .download,
          .play {
            width: 78px;
            height: 27px;
            border: 2px solid #ff8c00;
            background: #06384b;
            color: #ff8c00;
            font-size: 12px;
            font-family: Arial, sans-serif;
            cursor: default;
          }
        ]]></style>
      </head>

      <body>
        <div class="site">
          <header class="site-header">
            <h1>Chillest Website</h1>
            <p id="splash">Loading game splash...</p>
          </header>

          <div class="site-layout">
            <aside class="sidebar">
              <div class="input-wrapper">
                <div class="input-icon" aria-hidden="true"></div>
                <input class="search-input" placeholder="search..." aria-label="Search games" />
              </div>

              <nav class="catagories" aria-label="Game categories">
                <button class="bar active" type="button">All</button>
                <button class="bar" type="button">Action</button>
                <button class="bar" type="button">Arcade</button>
                <button class="bar" type="button">Puzzle</button>
              </nav>
            </aside>

            <main class="games-area">
              <div class="container">
                <div class="game-card">
                  <div class="game-name">Game 1</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 2</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 3</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 4</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 5</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 6</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 7</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
                <div class="game-card">
                  <div class="game-name">Game 8</div>
                  <div class="thumb"></div>
                  <div class="game-buttons">
                    <button class="download" type="button">Download</button>
                    <button class="play" type="button">Play</button>
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      </body>
    </html>
  </foreignObject>
</svg>
